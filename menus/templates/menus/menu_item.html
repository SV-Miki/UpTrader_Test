{% with item=node.obj %}
<li class="menu-item {% if node.is_active %}active{% endif %} {% if node.expanded %}expanded{% endif %}">
    <a href="{{ item.get_url }}" class="menu-link">{{ item.title }}</a>

    {% if node.children %}
    <ul class="submenu">
        {% for child in node.children %}
            {% include "menus/menu_item.html" with node=child %}
        {% endfor %}
    </ul>
    {% endif %}
</li>
{% endwith %}
